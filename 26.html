<!DOCTYPE html>
<html>
<head>
<style>
  div, p, h2 {
    background-color: lightblue;
    margin-bottom: 5px;
  }

  span, a, strong {
    background-color: yellow;
  }
</style>
</head>
<body>

  <h2>Block-level elements (each on its own line):</h2>
  <div>This is a div</div>
  <p>This is a paragraph</p>
  <h1>This is a heading</h1>

  <h2>Inline elements (flow together, same line):</h2>
  <p>
    This sentence has a <span>span</span>,
    a <a href="#">link</a>,
    and some <strong>bold text</strong>
    all flowing within the same line.
  </p>

</body>
</html>
