<!DOCTYPE html>
<html>
<head>
<style>
  .navbar {
    display: flex;              /* turns .navbar into a flex CONTAINER */
    justify-content: space-between; /* spaces items along the main axis (horizontal, by default) */
    align-items: center;            /* centers items along the cross axis (vertical, by default) */
    background-color: darkblue;
    padding: 15px;
    height: 60px;
  }

  .navbar a {
    color: white;
    text-decoration: none;
    padding: 10px;
  }

  .logo {
    font-weight: bold;
    font-size: 20px;
  }
</style>
</head>
<body>

  <div class="navbar">
    <div class="logo">MyBrand</div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

</body>
</html>
