<!DOCTYPE html>
<html>
<head>
<style>
  .box-1 {
    border: 3px solid black; /* width, style, and color in ONE declaration */
    padding: 15px;
    margin-bottom: 15px;
  }

  .box-2 {
    border: 3px dashed blue;
    padding: 15px;
    margin-bottom: 15px;
  }

  .box-3 {
    border: 3px dotted green;
    padding: 15px;
    margin-bottom: 15px;
  }

  .box-4 {
    border: 3px double red;
    padding: 15px;
    margin-bottom: 15px;
  }

  .box-5 {
    border: 3px solid purple;
    border-radius: 15px; /* rounds the corners */
    padding: 15px;
    margin-bottom: 15px;
  }

  .box-6 {
    border-top: 5px solid orange;    /* only the top side */
    border-bottom: 2px solid gray;   /* only the bottom side */
    padding: 15px;
  }
</style>
</head>
<body>

  <div class="box-1">Solid border</div>
  <div class="box-2">Dashed border</div>
  <div class="box-3">Dotted border</div>
  <div class="box-4">Double border</div>
  <div class="box-5">Solid border with rounded corners</div>
  <div class="box-6">Different border per side (top vs bottom)</div>

</body>
</html>
