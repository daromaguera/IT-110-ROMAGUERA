<!DOCTYPE html>
<html>
<head>
<style>
  /* 1. Class selector — targets any element with class="card" */
  .card {
    border: 1px solid gray;
    padding: 10px;
  }

  /* 2. ID selector — targets the one element with id="featured-card" */
  #featured-card {
    border-color: gold;
    background-color: lightyellow;
  }
</style>
</head>
<body>

  <div class="card">Product A</div>
  <div class="card">Product B</div>
  <div class="card" id="featured-card">Product C (Featured)</div>

</body>
</html>
