<!DOCTYPE html>
<html>
<head>
<style>
  /* 1. Grouping selector — applies the same rule to h1, h2, and h3 */
  h1, h2, h3 {
    font-family: Arial, sans-serif;
    color: darkblue;
  }

  /* 2. Descendant combinator (space) — any <p> nested inside a <div>,
     no matter how deep */
  div p {
    color: green;
  }

  /* 3. Child combinator (>) — only <li> elements that are DIRECT
     children of a <ul> */
  ul > li {
    font-weight: bold;
  }
</style>
</head>
<body>

  <h1>Heading 1</h1>
  <h2>Heading 2</h2>
  <h3>Heading 3</h3>

  <div>
    <p>This paragraph is inside the div — turns green.</p>
    <section>
      <p>This paragraph is nested deeper inside the div — still turns green.</p>
    </section>
  </div>

  <ul>
    <li>Direct child — bold</li>
    <li>Direct child — bold
      <ul>
        <li>Nested grandchild — NOT bold (not a direct child of the first ul)</li>
      </ul>
    </li>
  </ul>

</body>
</html>
