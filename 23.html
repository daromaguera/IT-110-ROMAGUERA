<!DOCTYPE html>
<html>
<head>
<style>
  .box {
    width: 200px;              /* content area */
    height: 100px;              /* content area */
    padding: 20px;               /* space inside the border, around the content */
    border: 5px solid black;     /* the visible edge */
    margin: 30px;                 /* space outside the border, pushing other elements away */
    background-color: lightblue; /* so you can see where content+padding ends */
    border-radius:25px 0px 0px 0px;
  }
</style>
</head>
<body>

  <div class="box" style="overflow:scroll">
    <div class="box">
        Content goes here
    </div>
  </div>

</body>
</html>
